services:

  # Monolito completo: Ingestion (scheduler) + Processing (bus en memoria) + Dashboard (API).
  # Un único servicio: el bus de eventos es en proceso y no cruza contenedores.
  platform:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: platform

    image: agatha-platform:latest

    container_name: agatha-platform

    env_file:
      - .env

    ports:
      - "8080:8080"

    # Deja tiempo al apagado ordenado (servidor, scheduler y drenado del bus: 10 s).
    stop_grace_period: 15s

    restart: unless-stopped
