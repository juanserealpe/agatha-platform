services:

  # Monolito Agatha: un solo proceso (el bus de eventos es en memoria y no cruza
  # contenedores). Los módulos se eligen con AGATHA_MODULES, separados por comas:
  #   baseline    scheduler de recálculo de líneas base
  #   processing  subscriber del bus + reconciliador horario (requiere baseline)
  #   dataos      ingesta de contingencia: consulta programada a DataOS
  #   callback    ingesta principal: POST :8080/ingestion/callback (excluyente con dataos)
  #   dashboard   API de solo lectura: GET :8080/api/dashboard/*
  # Vacía = baseline,processing,callback,dashboard. Cambiarla NO requiere rebuild.
  platform:
    build:
      context: .
      dockerfile: Dockerfile

    image: agatha-platform:latest

    container_name: agatha-platform

    env_file:
      - .env

    environment:
      AGATHA_MODULES: callback,dashboard

    ports:
      - "8080:8080"

    # Deja tiempo al apagado ordenado (servidor, schedulers y drenado del bus: 10 s).
    stop_grace_period: 15s

    restart: unless-stopped
