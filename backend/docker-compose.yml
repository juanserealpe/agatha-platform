services:

  # Monolito Agatha: un solo proceso (el bus de eventos es en memoria y no cruza
  # contenedores). Los módulos se eligen con AGATHA_MODULES, separados por comas:
  #   baseline    scheduler de recálculo de líneas base
  #   processing  evaluación horaria del índice I (requiere baseline; cargar antes los históricos)
  #   rule_engine interpreta processing.indicator_evaluated con umbrales versionados y publica
  #               leak_threshold_exceeded/cleared (requiere processing; antes: rule_engine -backfill)
  #   dataos      catch-up desde DataOS: con callback rellena huecos de más de 1 h
  #               (al arrancar, antes que processing, y cada hora). Requiere
  #               DATAOS_USERNAME/DATAOS_PASSWORD en el .env o la plataforma no arranca.
  #   callback    ingesta principal: POST :8080/ingestion/callback
  #   dashboard   API de solo lectura: GET :8080/api/dashboard/*
  #   alert_management alertas, /api/alerts y avisos al bus (requiere rule_engine)
  #   notifications    stream SSE (/api/notifications/stream), registro de tokens
  #                    (/api/devices/push-token) y push FCM
  # Vacía = baseline,callback,dashboard. Cambiarla NO requiere rebuild.
  platform:
    build:
      context: .
      dockerfile: Dockerfile

    image: agatha-platform:latest

    container_name: agatha-platform

    env_file:
      - .env

    environment:
      AGATHA_MODULES: callback,dashboard,baseline,processing,rule_engine,alert_management,notifications
      # Bloquea -rebuild (Rule Engine y Alert Management) y el endpoint de
      # eventos de prueba. Fijado acá para no depender del .env del VPS.
      AGATHA_ENV: production
      # Push FCM: el código valida sin entregar salvo que se pida "false". Solo el VPS entrega.
      FCM_VALIDATE_ONLY: "false"
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/agatha/fcm-service-account.json
      # Las variables de environment pisan las del .env: el endpoint de eventos
      # de prueba no se puede encender aquí por error.
      NOTIFICATIONS_TEST_ENDPOINT: "false"
      # El push de alertas va a TODOS los tokens registrados. Vacía aquí para
      # que una allowlist de pruebas olvidada en el .env no filtre celulares.
      NOTIFICATIONS_PUSH_DEVICE_ALLOWLIST: ""

    # Credencial de FCM (cuenta de servicio), en solo lectura. Va en
    # ./secrets/fcm-service-account.json, fuera del repositorio y de la imagen, y
    # tiene que poder leerla el usuario del contenedor (chmod 444). Si falta, el
    # push queda deshabilitado y el resto de la plataforma arranca igual.
    volumes:
      - ./secrets:/run/secrets/agatha:ro

    ports:
      - "127.0.0.1:8080:8080"

    # Deja tiempo al apagado ordenado (servidor, schedulers y drenado del bus: 10 s).
    stop_grace_period: 15s

    restart: unless-stopped
